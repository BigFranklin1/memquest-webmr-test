<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">从本地修改到线上网站的四个阶段</title>
<desc id="desc">编辑保存只在工作目录生效，commit 保存在本机 Git，push 上传到 GitHub，部署成功后才更新 Vercel。每步都不是下一步的自动保证。</desc>
<rect width="1440" height="400" rx="24" fill="#081222"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
<text x="48" y="56" font-size="26" fill="#f6d457">四个位置，四种“保存”</text>
<text x="48" y="90" font-size="18" fill="#bdc7d8">本地能看到改动 ≠ GitHub 已更新 ≠ 手机线上已更新</text>
<g fill="#142238" stroke="#34445c"><rect x="48" y="140" width="282" height="156" rx="16"/><rect x="402" y="140" width="282" height="156" rx="16"/><rect x="756" y="140" width="282" height="156" rx="16"/><rect x="1110" y="140" width="282" height="156" rx="16"/></g>
<g fill="#f0f3fb" font-size="25"><text x="72" y="187">① 本地工作目录</text><text x="426" y="187">② 本机 Git 历史</text><text x="780" y="187">③ GitHub 仓库</text><text x="1134" y="187">④ Vercel 网站</text></g>
<g fill="#bdc7d8" font-size="18"><text x="72" y="227">Codex / 编辑器修改文件</text><text x="72" y="263">localhost 预览</text><text x="426" y="227">commit：建立版本存档</text><text x="426" y="263">仍只在这台电脑上</text><text x="780" y="227">push：把提交上传</text><text x="780" y="263">协作者 pull 获取版本</text><text x="1134" y="227">deploy：构建并发布</text><text x="1134" y="263">HTTPS 真机测试</text></g>
<g fill="#f6d457" stroke="#f6d457" stroke-width="2"><path d="M340 216h48m-10-7 10 7-10 7M694 216h48m-10-7 10 7-10 7M1048 216h48m-10-7 10 7-10 7" fill="none"/></g>
<g fill="#f6d457" font-size="15" text-anchor="middle"><text x="364" y="198">commit</text><text x="718" y="198">push</text><text x="1072" y="198">deploy*</text></g>
<text x="48" y="351" font-size="17" fill="#bdc7d8">* 只有配置并成功触发 Git 集成时，push / merge 才可能自动部署；请检查部署状态和版本。</text>
</g></svg>
